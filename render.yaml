services:
  - type: web
    name: netconfirm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/main.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_REPO
        sync: false
